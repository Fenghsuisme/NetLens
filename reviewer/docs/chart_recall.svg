<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei','Heiti TC',sans-serif">
  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>
  <text x="380" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">逐類別召回率提升</text>
  <text x="380" y="66" text-anchor="middle" font-size="14" fill="#64748b">Semgrep 選點天花板　|　改善前 → 改善後</text>

  <!-- legend -->
  <rect x="565" y="30" width="14" height="14" rx="3" fill="#cbd5e1"/>
  <text x="585" y="42" font-size="12.5" fill="#475569">改善前</text>
  <rect x="655" y="30" width="14" height="14" rx="3" fill="#16a34a"/>
  <text x="675" y="42" font-size="12.5" fill="#475569">改善後</text>

  <!-- gridlines + y ticks -->
  <line x1="95" y1="95" x2="720" y2="95" stroke="#eef2f6"/>
  <line x1="95" y1="153" x2="720" y2="153" stroke="#eef2f6"/>
  <line x1="95" y1="211" x2="720" y2="211" stroke="#eef2f6"/>
  <line x1="95" y1="269" x2="720" y2="269" stroke="#eef2f6"/>
  <line x1="95" y1="327" x2="720" y2="327" stroke="#eef2f6"/>
  <text x="82" y="99" text-anchor="end" font-size="12" fill="#94a3b8">100</text>
  <text x="82" y="157" text-anchor="end" font-size="12" fill="#94a3b8">80</text>
  <text x="82" y="215" text-anchor="end" font-size="12" fill="#94a3b8">60</text>
  <text x="82" y="273" text-anchor="end" font-size="12" fill="#94a3b8">40</text>
  <text x="82" y="331" text-anchor="end" font-size="12" fill="#94a3b8">20</text>
  <text x="82" y="389" text-anchor="end" font-size="12" fill="#94a3b8">0</text>
  <text x="60" y="88" font-size="12" fill="#64748b">召回 %</text>

  <!-- axes -->
  <line x1="95" y1="95" x2="95" y2="385" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="95" y1="385" x2="720" y2="385" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Group 1: 指令注入 76.7 -> 99 (center 157.5) -->
  <rect x="111.5" y="162.6" width="42" height="222.4" rx="4" fill="#cbd5e1"/>
  <rect x="161.5" y="97.9" width="42" height="287.1" rx="4" fill="#16a34a"/>
  <text x="132.5" y="154" text-anchor="middle" font-size="10.5" fill="#64748b">76.7</text>
  <text x="182.5" y="90" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">99</text>
  <text x="157.5" y="406" text-anchor="middle" font-size="12.5" fill="#334155">指令注入</text>

  <!-- Group 2: SQL 76.7 -> 99.3 (center 282.5) -->
  <rect x="236.5" y="162.6" width="42" height="222.4" rx="4" fill="#cbd5e1"/>
  <rect x="286.5" y="97.03" width="42" height="287.97" rx="4" fill="#16a34a"/>
  <text x="257.5" y="154" text-anchor="middle" font-size="10.5" fill="#64748b">76.7</text>
  <text x="307.5" y="90" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">99.3</text>
  <text x="282.5" y="406" text-anchor="middle" font-size="12.5" fill="#334155">SQL 注入</text>

  <!-- Group 3: 反序列化 72 -> 94.7 (center 407.5) -->
  <rect x="361.5" y="176.2" width="42" height="208.8" rx="4" fill="#cbd5e1"/>
  <rect x="411.5" y="110.4" width="42" height="274.6" rx="4" fill="#16a34a"/>
  <text x="382.5" y="168" text-anchor="middle" font-size="10.5" fill="#64748b">72</text>
  <text x="432.5" y="102" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">94.7</text>
  <text x="407.5" y="406" text-anchor="middle" font-size="12.5" fill="#334155">反序列化</text>

  <!-- Group 4: 原型污染 60 -> 96 (center 532.5) -->
  <rect x="486.5" y="211" width="42" height="174" rx="4" fill="#cbd5e1"/>
  <rect x="536.5" y="106.6" width="42" height="278.4" rx="4" fill="#16a34a"/>
  <text x="507.5" y="203" text-anchor="middle" font-size="10.5" fill="#64748b">60</text>
  <text x="557.5" y="98" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">96</text>
  <text x="532.5" y="406" text-anchor="middle" font-size="12.5" fill="#334155">原型污染</text>

  <!-- Group 5: 檔案上傳 22.5 -> 95 (center 657.5) -->
  <rect x="611.5" y="319.75" width="42" height="65.25" rx="4" fill="#cbd5e1"/>
  <rect x="661.5" y="109.5" width="42" height="275.5" rx="4" fill="#16a34a"/>
  <text x="632.5" y="311" text-anchor="middle" font-size="10.5" fill="#64748b">22.5</text>
  <text x="682.5" y="101" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">95</text>
  <text x="657.5" y="406" text-anchor="middle" font-size="12.5" fill="#334155">檔案上傳</text>
</svg>
