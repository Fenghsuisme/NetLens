    parsers (SpEL, OGNL, MVEL), script engines, or dynamic class definition flows
    allows execution of arbitrary Java code context or remote code execution (RCE).'
  languages:
  - java
  severity: ERROR
  metadata:
    cwe:
    - CWE-94
- id: java-file-upload-cwe434
