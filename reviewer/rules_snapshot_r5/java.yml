rules:
- id: java-xss-cwe79
  pattern-either:
  - pattern: $RESP.getWriter().print(...)
  - pattern: $RESP.getWriter().println(...)
  - pattern: $RESP.getWriter().write(...)
  - pattern: $RESP.getOutputStream().write(...)
  - pattern: $MODEL.addAttribute(..., request.getParameter(...));
  - pattern: new ModelAndView(..., "..." + $VAR + "...")
  - pattern: 'return "redirect:" + $VAR;

      '
  - pattern: 'Response.ok(...).type(MediaType.TEXT_HTML).build()

      '
  - pattern: 'Response.status(...).entity(...).type("text/html").build()

      '
  message: 'Cross-Site Scripting risk (CWE-79): Detected unvalidated user inputs or
    HTTP parameters flowing directly into HTML response channels, Spring MVC redirects,
    or JAX-RS text/html outputs without proper contextual encoding.'
  languages:
  - java
  severity: ERROR
  metadata:
    cwe:
    - CWE-79
- id: java-sqli-cwe89
  pattern-either:
  - pattern: $STMT.executeQuery("..." + $VAR + "...")
  - pattern: $STMT.execute("..." + $VAR + "...")
  - pattern: $STMT.executeUpdate("..." + $VAR + "...")
  - pattern: $CONN.prepareStatement("..." + $VAR + "...")
  - pattern: $JT.queryForList("..." + $VAR + "...", ...)
  - pattern: $JT.update("..." + $VAR + "...", ...)
  - pattern: $EM.createQuery("..." + $VAR + "...")
  - pattern: $SESS.createQuery("..." + $VAR + "...")
  - pattern: '@Select("... ${$VAR} ...")

      '
  - pattern: '@Update("... ${$VAR} ...")

      '
  message: 'SQL Injection risk (CWE-89): Detected untrusted variables bound via string
    concatenation or dynamic execution variables ($ instead of #) across JDBC, Spring
    JDBC, Hibernate, or MyBatis. Use strictly parametrized inputs.'
  languages:
  - java
  severity: ERROR
  metadata:
    cwe:
    - CWE-89
- id: java-csrf-disabled-cwe352
  pattern-either:
  - pattern: $HTTP.csrf().disable()
  - pattern: '$SPEC -> $SPEC.disable()

      '
  message: 'Cross-Site Request Forgery risk (CWE-352): Disabling CSRF protection layer
    exposed state-changing pathways to unauthenticated remote cross-origin replays.'
  languages:
  - java
  severity: ERROR
  metadata:
    cwe:
    - CWE-352
- id: java-missing-authorization-cwe862
  pattern-not-contained-by:
  - pattern: '@PreAuthorize(...)

      $TYPE $FUNC(...) { ... }

      '
  - pattern: '@Secured(...)

      $TYPE $FUNC(...) { ... }

      '
  - pattern: '@RolesAllowed(...)

      $TYPE $FUNC(...) { ... }

      '
  pattern-either:
  - pattern: '@RequestMapping(value = {..., "...admin...", ...}, ...)

      $TYPE $FUNC(...) { ... }

      '
  - pattern: '@GetMapping({..., "...admin...", ...})

      $TYPE $FUNC(...) { ... }

      '
  - pattern: '@PostMapping({..., "...admin...", ...})

      $TYPE $FUNC(...) { ... }

      '
  message: 'Missing Authorization (CWE-862): Endpoint associated with privileged paths
    (e.g., /admin/) lacks role-based access control annotations (@PreAuthorize, @Secured,
    or @RolesAllowed).'
  languages:
  - java
  severity: ERROR
  metadata:
    cwe:
    - CWE-862
- id: java-path-traversal-cwe22
  pattern-either:
  - pattern: new File(...)
  - pattern: java.io.File(...)
  - pattern: Paths.get(...)
  - pattern: java.nio.file.Paths.get(...)
  - pattern: new FileInputStream(...)
  - pattern: new FileOutputStream(...)
  - pattern: new FileWriter(...)
  - pattern: new FileReader(...)
  - pattern: $ENTRY.getName()
