    allocation or array index. Please validate your integer bounds.'
  languages:
  - java
  severity: ERROR
  metadata:
    cwe:
    - CWE-190
- id: java-resource-consumption-cwe400
  pattern-either:
  - pattern: "for (int $I = 0; $I < Integer.parseInt(...); $I++) {\n    ...\n    new\
      \ Thread(...).start();\n    ...\n}\n"
  - pattern: 'new java.util.ArrayList<>(Integer.parseInt(...))

      '
  - pattern: 'new java.util.HashMap<>(Integer.parseInt(...))

      '
  - pattern: "java.io.FileInputStream $STREAM = ...;\n...\nif ($COND) {\n    return\
      \ $VAL;\n}\n"
  message: 'Uncontrolled Resource Consumption (CWE-400): Unbounded dynamic Java resource
    allocation detected. Limit the maximum size when constructing collections from
    external inputs, restrict maximum active thread creation, and ensure file/network
    streams are explicitly scoped or closed (or use try-with-resources) to prevent
    Denial of Service (DoS).'
  languages:
  - java
  severity: ERROR
  metadata:
    cwe:
    - CWE-400
- id: java-hidden-functionality-cwe912
  pattern-either:
  - pattern: "if (\"admin_secret_pass\".equals($USER_INPUT)) {\n    ...\n}\n"
  - pattern: 'Runtime.getRuntime().exec(request.getParameter("hidden_cmd"))

      '
  - pattern: "if (System.getenv(\"BACKDOOR_KEY\").equals($SECRET_KEY)) {\n    ...\n\
      }\n"
  message: 'Hidden Functionality / Backdoor (CWE-912): Detected suspicious hidden
    control paths, magic string checks, or backdoor command execution triggers in
    Java. Remove unintended code or document all operational entry points thoroughly.'
  languages:
  - java
  severity: ERROR
  metadata:
    cwe:
    - CWE-912
- id: java-untrusted-inclusion-cwe829
  pattern-either:
  - pattern: 'new URLClassLoader(new URL[]{new URL($URL)})

      '
  - pattern: 'Class.forName(request.getParameter("className"))

      '
  - pattern: "if ($REPO_URL.startsWith(\"http://\")) {\n    ...\n}\n"
  message: 'Inclusion of Functionality from Untrusted Control Sphere (CWE-829): Code
    dynamically imports, downloads, or configures software execution from untrusted
    sources or unencrypted channels. Verify the integrity of external components,
    use HTTPS for package repositories, and enforce a strict allowlist for dynamic
    class loading.'
  languages:
  - java
  severity: ERROR
  metadata:
    cwe:
    - CWE-829
- id: java-class-pollution-cwe1321
  pattern-either:
  - pattern: 'BeanUtils.setProperty($OBJ, request.getParameter("property"), request.getParameter("value"))

      '
  - pattern: '$NODE.put("class", $VAL)

      '
  - pattern: "if (\"class\".equals(request.getParameter(\"key\"))) {\n    ...\n}\n"
  message: 'Improper Control of Generation of Prototype Nodes (''Prototype Pollution''
    / Class Pollution) (CWE-1321): Unsafe dynamic property manipulation or reflection
    allows attackers to modify the class loader or underlying class templates (e.g.,
    via ''class.classLoader''). Sanitize inputs and block special keywords like ''class''
    or ''classLoader'' before processing object attributes.'
  languages:
  - java
  severity: ERROR
  metadata:
    cwe:
    - CWE-1321
- id: java-cert-validation-cwe295
  pattern-either:
  - pattern: "public void checkServerTrusted(X509Certificate[] chain, String authType)\
      \ {\n    ...\n}\n"
  - pattern: "public boolean verify(String hostname, SSLSession session) {\n    return\
      \ true;\n}\n"
  - pattern: '$CONTEXT.init(null, $MANAGERS, null);

      '
  message: 'Improper Certificate Validation (CWE-295): The application does not properly
    validate SSL/TLS certificates or hostnames, allowing potential Man-in-the-Middle
    (MITM) attacks. Ensure that checkServerTrusted throws CertificateException for
    invalid certificates and HostnameVerifier checks matching domains.'
  languages:
  - java
  severity: ERROR
  metadata:
    cwe:
    - CWE-295
- id: java-weak-hash-cwe328
  pattern-either:
