    arbitrary class instantiation and execution of remote malicious code (RCE).'
  languages:
  - java
  severity: ERROR
  metadata:
    cwe:
    - CWE-502
- id: java-incorrect-authorization-cwe863
  pattern-either:
  - pattern: '@PreAuthorize("...USER...")

      $TYPE $FUNC(...) { ... }

      '
  - pattern: '@Secured("...USER...")

      $TYPE $FUNC(...) { ... }

      '
  - pattern: 'if ($REQ.isUserInRole("USER")) { ... }

