  - java
  severity: ERROR
  metadata:
    cwe:
    - CWE-22
- id: java-command-injection-cwe78
  pattern-either:
  - pattern: Runtime.getRuntime().exec(...)
  - pattern: $RUNTIME.exec(...)
  - pattern: new ProcessBuilder(...)
  - pattern: java.lang.ProcessBuilder(...)
  message: 'OS Command Injection risk (CWE-78): Passing unvalidated or concatenated
    dynamic strings to execution environments allows attackers to inject malicious
    shell metacharacters and execute arbitrary system commands.'
  languages:
  - java
  severity: ERROR
  metadata:
    cwe:
    - CWE-78
- id: java-code-injection-cwe94
  pattern-either:
  - pattern: $PARSER.parseExpression(...)
  - pattern: new SpelExpressionParser(...)
  - pattern: $ENGINE.eval(...)
  - pattern: MVEL.eval(...)
  - pattern: Ognl.getValue(...)
  - pattern: $LOADER.defineClass(...)
