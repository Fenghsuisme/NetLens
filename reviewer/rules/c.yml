      - pattern: MD5($DATA, $LEN, $MD)
      - pattern: SHA1($DATA, $LEN, $MD)

      # --- Pattern 2: OpenSSL Init Context APIs ---
      - pattern: MD5_Init($CTX)
      - pattern: SHA1_Init($CTX)

      # --- Pattern 3: OpenSSL EVP High-Level Message Digests ---
      - pattern: EVP_md5()
      - pattern: EVP_sha1()

