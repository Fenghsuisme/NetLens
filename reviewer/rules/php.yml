    broken and prone to collision attacks. Use secure alternatives like bcrypt, Argon2
    (via password_hash), or SHA-256/SHA-512 (via hash/hash_hmac).'
  languages:
  - php
  severity: ERROR
  metadata:
    cwe:
    - CWE-328