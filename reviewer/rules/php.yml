- id: php-weak-hash-cwe328
  # 直接匹配 md5/sha1 呼叫。CWE-328 弱雜湊本質是「使用了破損演算法」，
  # 與輸入是否受污染無關；原本 taint 模式的 pattern-sources 混入裸 $PASSWORD/$SECRET
  # （semgrep 中 $大寫 為萬用字元＝任意變數），taint 約束因而失效、退化成本規則現況，
  # 故直接以呼叫本身為錨點，行為等價且移除語意化 metavariable 缺陷。
  pattern-either:
  - pattern: md5(...)
  - pattern: sha1(...)
  - pattern: hash("md5", ...)
  - pattern: hash("sha1", ...)
  - pattern: hash_hmac("md5", ...)
  - pattern: hash_hmac("sha1", ...)
