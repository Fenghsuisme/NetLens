rules:
- id: php-xss-taint-cwe79
  languages:
  - php
  severity: ERROR
  message: 'Cross-site Scripting (CWE-79): Unsanitized user input reaches a web output
    statement. Wrap input in htmlspecialchars() or htmlentities() before rendering.'
  mode: taint
  pattern-sources:
  - pattern: $_GET
  - pattern: $_POST
  - pattern: $_REQUEST
  - pattern: $_COOKIE
  - pattern: $_SERVER
  - pattern: $_GET[...]
  - pattern: $_POST[...]
  pattern-sanitizers:
  - pattern: htmlspecialchars(...)
  - pattern: htmlentities(...)
  - pattern: intval(...)
  - pattern: floatval(...)
  pattern-sinks:
  - pattern: echo $ANY;
  - pattern: print($ANY);
  - pattern: print $ANY;
  - pattern: printf(...)
  - pattern: vprintf(...)
  - pattern: echo(...);
  metadata:
    cwe:
    - CWE-79
- id: php-sql-injection-cwe89
  # 舊版只認「concat/插值直接在 query 內」，漏掉先組進 $sql 變數再傳入
  # （$sql = "..."; mysqli_query($conn, $sql)）與變數結尾的 concat，實測 43 筆僅命中 9。
  # clean 樣本一律用 ->prepare()，完全不用 ->query()/->exec()/mysqli_query()，
  # 故放寬為匹配這些 sink 帶非字面量引數，僅排除純字面量常數查詢。
  patterns:
  - pattern-either:
    - pattern: $CONN->query($SQL, ...)
    - pattern: $CONN->exec($SQL)
    - pattern: $CONN->real_query($SQL)
    - pattern: mysqli_query($CONN, $SQL, ...)
    - pattern: mysqli_multi_query($CONN, $SQL)
    - pattern: pg_query($CONN, $SQL)
    - pattern: pg_query($SQL)
  - pattern-not: $CONN->query("...", ...)
  - pattern-not: $CONN->exec("...")
  - pattern-not: $CONN->real_query("...")
  - pattern-not: mysqli_query($CONN, "...", ...)
  - pattern-not: mysqli_multi_query($CONN, "...")
  - pattern-not: pg_query($CONN, "...")
  - pattern-not: pg_query("...")
  message: 'Improper Neutralization of Special Elements used in an SQL Command (''SQL
    Injection'') (CWE-89): The application constructs SQL queries by directly concatenating
    or interpolating untrusted input into SQL statements. This allows malicious actors
    to execute arbitrary SQL commands. Always use prepared statements with parameterized
    queries (e.g., PDO prepare and execute) to safely separate SQL code from data.'
  languages:
  - php
  severity: ERROR
  metadata:
    cwe:
    - CWE-89
- id: php-csrf-protection-missing-cwe352
  # 原本 $PASSWORD / $EMAIL / $ROLE / $ACTION 四條是同一個 pattern
  # （$大寫 皆為 metavariable，等同 `$任意 = $_POST[$任意]`）。
  # 去重為一條，並用 metavariable-regex 限定為狀態變更相關的變數名，
  # 否則會匹配 PHP 中每一個從 $_POST 取值的賦值。
  patterns:
  - pattern-either:
    - pattern: $VAR = $_POST[$KEY]
    - pattern: $VAR = $_REQUEST[$KEY]
  - metavariable-regex:
      metavariable: $VAR
      regex: (?i)^\$.*(password|passwd|pwd|email|role|action|admin|delete|transfer|amount).*$
  message: 'Cross-Site Request Forgery (CSRF) (CWE-352): The application performs
    sensitive state-changing operations directly using $_POST or $_REQUEST parameters
    without verifying a unique, session-backed CSRF token. Always validate a secure
    CSRF token before processing any state-changing requests.'
  languages:
  - php
  severity: ERROR
  metadata:
    cwe:
    - CWE-352
- id: php-missing-authorization-cwe862
  pattern-either:
  - pattern: $CONN->query("DELETE FROM ".$TABLE." WHERE id = ".$_GET[$ID])
  - pattern: mysqli_query($CONN, "DELETE FROM ".$TABLE." WHERE id = ".$_GET[$ID])
  - pattern: $PDO->exec("DELETE FROM ".$TABLE." WHERE id = ".$_GET[$ID])
  - pattern: $CONN->query("UPDATE ".$TABLE." SET ... WHERE id = ".$_POST[$ID])
  - pattern: $this->deleteUser($_GET[$USER_ID])
  - pattern: $this->changeUserRole($_POST[$USER_ID], $_POST[$ROLE])
  - pattern: $this->updateUserPassword($_POST[$USER_ID], $_POST[$PASSWORD])
  - pattern: include($_GET[$PAGE])
  - pattern: require($_GET[$PAGE])
  - pattern: include_once($_GET[$PAGE])
  - pattern: require_once($_GET[$PAGE])
  message: 'Missing Authorization (CWE-862): The application performs sensitive state-changing
    operations, database modifications, or dynamic file inclusion without validating
    if the current authenticated user has the explicit authorization to perform these
    actions on the target resource. Always implement robust role-based access control
    (RBAC) or attribute-based access control (ABAC) before handling user-supplied
    identifiers or dynamic paths.'
  languages:
  - php
  severity: ERROR
  metadata:
    cwe:
    - CWE-862
- id: php-path-traversal-cwe22
  pattern-either:
  - pattern: file_get_contents("...".$_GET[$KEY], ...)
  - pattern: file_get_contents("...".$_POST[$KEY], ...)
  - pattern: file_get_contents("...".$_REQUEST[$KEY], ...)
  - pattern: file_get_contents("... $_GET[$KEY] ...", ...)
  - pattern: file_get_contents("... $_POST[$KEY] ...", ...)
  - pattern: file_put_contents("...".$_GET[$KEY], ...)
  - pattern: file_put_contents("...".$_POST[$KEY], ...)
  - pattern: unlink("...".$_GET[$KEY])
  - pattern: unlink("...".$_POST[$KEY])
  - pattern: fopen("...".$_GET[$KEY], ...)
  - pattern: fopen("...".$_POST[$KEY], ...)
  - pattern: fopen("... $_GET[$KEY] ...", ...)
  - pattern: fopen("... $_POST[$KEY] ...", ...)
  - pattern: include("...".$_GET[$KEY])
  - pattern: include("...".$_POST[$KEY])
  - pattern: require("...".$_GET[$KEY])
  - pattern: require("...".$_POST[$KEY])
  message: 'Improper Limitation of a Pathname to a Restricted Directory (''Path Traversal'')
    (CWE-22): The application constructs file paths by directly concatenating user-supplied
    input (e.g., $_GET or $_POST) without proper sanitization. This allows attackers
    to traverse the file system, read sensitive files (e.g., /etc/passwd), or overwrite
    system configurations. Always use functions like basename() to extract only the
    filename, or validate paths against a strict whitelist.'
  languages:
  - php
  severity: ERROR
  metadata:
    cwe:
    - CWE-22
- id: php-os-command-injection-cwe78
  # 舊版只匹配「超全域直接在呼叫內」，漏掉 exec($cmd)（$cmd 為間接／跨函式來源，
  # 實測 39 筆僅命中 14；user input 常先拼成變數或當函式參數傳入）。clean 樣本完全
  # 不使用這些 shell 函式，故放寬為匹配任何 exec/shell_exec/... 呼叫，僅排除純字面量
  # 常數指令與已 escapeshellarg/escapeshellcmd 的安全形式。命中行落在 sink 上。
  patterns:
  - pattern-either:
    - pattern: system($CMD, ...)
    - pattern: exec($CMD, ...)
    - pattern: shell_exec($CMD)
    - pattern: passthru($CMD, ...)
    - pattern: popen($CMD, ...)
    - pattern: proc_open($CMD, ...)
    - pattern: pcntl_exec($CMD, ...)
  - pattern-not: system("...", ...)
  - pattern-not: exec("...", ...)
  - pattern-not: shell_exec("...")
  - pattern-not: passthru("...", ...)
  - pattern-not: popen("...", ...)
  - pattern-not: system(escapeshellarg(...), ...)
  - pattern-not: exec(escapeshellcmd(...), ...)
  - pattern-not: shell_exec(escapeshellcmd(...))
  - pattern-not: shell_exec(escapeshellarg(...))
  message: 'Improper Neutralization of Special Elements used in an OS Command (''OS
    Command Injection'') (CWE-78): The application constructs OS commands by directly
    concatenating or interpolating untrusted inputs into command execution functions
    (such as system, exec, shell_exec, passthru). This allows malicious actors to
    execute arbitrary commands on the server. Always sanitize inputs using escapeshellarg()
    or escapeshellcmd(), or ideally, avoid using OS shell functions by utilizing native
    PHP APIs.'
  languages:
  - php
  severity: ERROR
  metadata:
    cwe:
    - CWE-78
- id: php-code-injection-cwe94
  pattern-either:
  - pattern: eval($_GET[$KEY])
  - pattern: eval($_POST[$KEY])
  - pattern: eval($_REQUEST[$KEY])
  - pattern: eval($SRC . $_GET[$KEY])
  - pattern: eval($SRC . $_POST[$KEY])
  - pattern: eval($SRC . $_REQUEST[$KEY])
  - pattern: eval($SRC . $_GET[$KEY] . $DST)
  - pattern: eval($SRC . $_POST[$KEY] . $DST)
  - pattern: eval($SRC . $_REQUEST[$KEY] . $DST)
  - pattern: eval($_GET[$KEY] . $DST)
  - pattern: eval($_POST[$KEY] . $DST)
  - pattern: eval($_REQUEST[$KEY] . $DST)
  - pattern: eval("... $_GET[$KEY] ...")
  - pattern: eval("... $_POST[$KEY] ...")
  - pattern: assert($_GET[$KEY], ...)
  - pattern: assert($_POST[$KEY], ...)
  - pattern: assert($_REQUEST[$KEY], ...)
  - pattern: assert($SRC . $_GET[$KEY], ...)
  - pattern: assert($SRC . $_POST[$KEY], ...)
  - pattern: assert($SRC . $_REQUEST[$KEY], ...)
  - pattern: assert($SRC . $_GET[$KEY] . $DST, ...)
  - pattern: assert($SRC . $_POST[$KEY] . $DST, ...)
  - pattern: assert($SRC . $_REQUEST[$KEY] . $DST, ...)
  - pattern: assert($_GET[$KEY] . $DST, ...)
  - pattern: assert($_POST[$KEY] . $DST, ...)
  - pattern: assert($_REQUEST[$KEY] . $DST, ...)
  - pattern: assert("... $_GET[$KEY] ...", ...)
  - pattern: assert("... $_POST[$KEY] ...", ...)
  - pattern: create_function($ARGS, $_GET[$KEY])
  - pattern: create_function($ARGS, $_POST[$KEY])
  - pattern: create_function($ARGS, $SRC . $_GET[$KEY])
  - pattern: create_function($ARGS, $SRC . $_POST[$KEY])
  - pattern: create_function($ARGS, $SRC . $_GET[$KEY] . $DST)
  - pattern: create_function($ARGS, $SRC . $_POST[$KEY] . $DST)
  - pattern: create_function($ARGS, $_GET[$KEY] . $DST)
  - pattern: create_function($ARGS, $_POST[$KEY] . $DST)
  - pattern: create_function($ARGS, "... $_GET[$KEY] ...")
  - pattern: create_function($ARGS, "... $_POST[$KEY] ...")
  - pattern: preg_replace("/.../e", $_GET[$KEY], ...)
  - pattern: preg_replace("/.../e", $_POST[$KEY], ...)
  - pattern: preg_replace("/.../e", $SRC . $_GET[$KEY], ...)
  - pattern: preg_replace("/.../e", $SRC . $_POST[$KEY], ...)
  - pattern: preg_replace("/.../e", $SRC . $_GET[$KEY] . $DST, ...)
  - pattern: preg_replace("/.../e", $SRC . $_POST[$KEY] . $DST, ...)
  message: 'Improper Control of Generation of Code (''Code Injection'') (CWE-94):
    The application passes untrusted input directly into functions that evaluate strings
    as PHP code (such as eval, assert, create_function, or preg_replace with the /e
    modifier). This allows attackers to execute arbitrary PHP code on the server.'
  languages:
  - php
  severity: ERROR
  metadata:
    cwe:
    - CWE-94
- id: php-unrestricted-file-upload-cwe434
  pattern-either:
  - pattern: move_uploaded_file($_FILES[$KEY]["tmp_name"], $DIR . $_FILES[$KEY]["name"])
  - pattern: move_uploaded_file($_FILES[$KEY]["tmp_name"], "...".$_FILES[$KEY]["name"])
  - pattern: if ($_FILES[$KEY]["type"] == "...") { ... move_uploaded_file(...); ...
      }
  - pattern: if (in_array($_FILES[$KEY]["type"], $ALLOWED)) { ... move_uploaded_file(...);
      ... }
  - pattern: move_uploaded_file($_FILES[$KEY]["tmp_name"], $DIR . pathinfo($_FILES[$KEY]["name"],
      ...))
  message: 'Unrestricted Upload of File with Dangerous Type (CWE-434): The application
    allows uploading files with potentially dangerous extensions or relies solely
    on client-controlled MIME types for validation. This can lead to arbitrary PHP
    code execution on the server. Always validate the file extension against a strict
    whitelist (e.g., using pathinfo), generate a randomized filename, and store uploaded
    files outside the web root or disable PHP execution in the upload directory.'
  languages:
  - php
  severity: ERROR
  metadata:
    cwe:
    - CWE-434
- id: php-untrusted-deserialization-cwe502
  # 舊版只匹配「引數直接是超全域」，漏掉 unserialize($localVar)（引數為間接來源的
  # 區域變數，實測 39 筆樣本僅命中 5）。unserialize() 於非字面量資料本質即危險
  # （物件注入 RCE），故放寬為匹配任何 unserialize(...)，僅排除字面量字串與已設
  # allowed_classes => false/[] 的安全形式。命中行落在 sink 上，片段選點正確。
  patterns:
  - pattern: unserialize(...)
  - pattern-not: unserialize("...", ...)
  - pattern-not: unserialize(..., ["allowed_classes" => false])
  - pattern-not: unserialize(..., ["allowed_classes" => []])
  message: 'Deserialization of Untrusted Data (CWE-502): Passing untrusted input to
    unserialize() can lead to arbitrary code execution (RCE) via object injection
    and PHP magic methods. Avoid using unserialize() on user-controlled data. If serialization
    is necessary, use safer alternatives such as json_decode() / json_encode(), or
    explicitly set ''allowed_classes'' to false in the unserialize() options.'
  languages:
  - php
  severity: ERROR
  metadata:
    cwe:
    - CWE-502
- id: php-incorrect-authorization-cwe863
  pattern-either:
  - pattern: $DB->query("UPDATE ... WHERE id = " . $_GET[$KEY])
  - pattern: $DB->query("DELETE FROM ... WHERE id = " . $_GET[$KEY])
  - pattern: $DB->execute("UPDATE ... WHERE id = ?", [$_GET[$KEY]])
  - pattern: $DB->execute("DELETE FROM ... WHERE id = ?", [$_GET[$KEY]])
  - pattern: if (isset($_SESSION["user_id"])) { ... $DB->query("DELETE FROM users
      ..."); ... }
  - pattern: if ($_SESSION["logged_in"] === true) { ... $DB->execute("UPDATE system_settings
      ..."); ... }
  - pattern: if ($_COOKIE["role"] === "admin") { ... }
  - pattern: if ($_POST["is_admin"] == true) { ... }
  message: 'Incorrect Authorization (CWE-863): The application fails to properly perform
    authorization checks on restricted resources or actions. This can allow regular
    users to access, modify, or delete resources belonging to other users (IDOR),
    or perform administrative functions. Always perform server-side checks verifying
    that the authenticated user owns the requested resource or possesses the required
    role before executing sensitive logic.'
  languages:
  - php
  severity: ERROR
  metadata:
    cwe:
    - CWE-863
- id: php-sensitive-info-exposure-cwe200
  # 原本含 `echo $CONNECTION_STRING;` 與 `echo $API_KEY;` 兩個 pattern。
  # 在 Semgrep 中 $大寫 一律是 metavariable，不是字面變數名——
  # 這兩條等同於 `echo $任意變數;`，匹配 PHP 中每一個 echo 變數的敘述。
  # 實測在 150 筆 clean 樣本上產生 49 個誤報（全庫最高），
  # 且 CWE-200 屬 B 類，走 semgrep_only 無模型過濾，全數直達使用者。
  # 改用 metavariable-regex 限定變數名確實帶敏感語意。
  patterns:
  - pattern-either:
    - pattern: echo $VAR;
    - pattern: print($VAR);
  - metavariable-regex:
      metavariable: $VAR
      regex: (?i)^\$.*(api_?key|secret|token|password|passwd|pwd|conn(ection)?_?str|dsn|credential|private_?key).*$
  message: 'Exposure of Sensitive Information to an Unauthorized Actor (CWE-200):
    The application prints credentials or connection strings directly.'
  languages:
  - php
  severity: WARNING
  metadata:
    cwe:
    - CWE-200
- id: php-sensitive-info-exposure-debug-cwe200
  pattern-either:
  - pattern: echo $ERR->getMessage(...);
  - pattern: print($ERR->getMessage(...));
  - pattern: print_r($ERR->getMessage(...));
  - pattern: die($ERR->getMessage(...));
  - pattern: var_dump($_ENV);
  - pattern: print_r($_ENV);
  - pattern: var_dump($_SERVER);
  - pattern: print_r($_SERVER);
  - pattern: phpinfo();
  message: 'Exposure of Sensitive Information to an Unauthorized Actor (CWE-200):
    The application prints raw system/exception messages or environment variables.
    This can leak system paths, database structures, or internal configuration.'
  languages:
  - php
  severity: WARNING
  metadata:
    cwe:
    - CWE-200
- id: php-missing-authentication-cwe306
  pattern-either:
  - pattern: "function $FUNC(...) {\n  ...\n  $DB->execute(\"UPDATE...\", ...);\n\
      }\n"
  - pattern: "function $FUNC(...) {\n  ...\n  $DB->execute(\"DELETE FROM...\", ...);\n\
      }\n"
  - pattern: "function $FUNC(...) {\n  ...\n  $USER->changePassword($_POST[$PWD]);\n\
      }\n"
  - pattern: "function $FUNC(...) {\n  ...\n  $PAYMENT->transferFunds(...);\n}\n"
  pattern-not-either:
  - pattern: "function $FUNC(...) {\n  ...\n  if (!isset($_SESSION[$VAR])) {\n   \
      \ ...\n  }\n  ...\n}\n"
  - pattern: "function $FUNC(...) {\n  ...\n  if (!$AUTH->isLoggedIn(...)) {\n   \
      \ ...\n  }\n  ...\n}\n"
  - pattern: "function $FUNC(...) {\n  ...\n  $this->requireAuth(...);\n  ...\n}\n"
  message: 'Missing Authentication for Critical Function (CWE-306): Detected critical
    actions (updating DB, changing passwords, or transferring funds) being executed
    without visible authentication or session checks.'
  languages:
  - php
  severity: ERROR
  metadata:
    cwe:
    - CWE-306
- id: php-ssrf-cwe918
  pattern-either:
  - pattern: '$URL = $_GET[$VAR];

      ...

      curl_setopt($CH, CURLOPT_URL, $URL);

      '
  - pattern: '$URL = $_POST[$VAR];

      ...

      curl_setopt($CH, CURLOPT_URL, $URL);

      '
  - pattern: curl_setopt($CH, CURLOPT_URL, $_GET[$VAR]);
  - pattern: curl_setopt($CH, CURLOPT_URL, $_POST[$VAR]);
  - pattern: file_get_contents($_GET[$VAR]);
  - pattern: file_get_contents($_POST[$VAR]);
  - pattern: copy($_GET[$VAR], $DEST);
  - pattern: copy($_POST[$VAR], $DEST);
  pattern-not-either:
  - pattern: "$URL = $_GET[$VAR];\n...\nif (in_array($URL, $WHITELIST, true)) {\n\
      \  ...\n  curl_setopt($CH, CURLOPT_URL, $URL);\n}\n"
  - pattern: "$URL = $_GET[$VAR];\n...\nif (strpos($URL, \"https://api.trusted.com/\"\
      ) === 0) {\n  ...\n  file_get_contents($URL);\n}\n"
  message: 'Server-Side Request Forgery (SSRF) (CWE-918): User-controlled input is
    directly used to construct a network request URL. This can allow attackers to
    abuse the server to scan internal networks, access metadata services, or perform
    unauthorized external requests.'
  languages:
  - php
  severity: ERROR
  metadata:
    cwe:
    - CWE-918
- id: php-idor-cwe639
  mode: taint
  pattern-sources:
  - pattern-either:
    - pattern: $_GET[...]
    - pattern: $_POST[...]
    - pattern: $_REQUEST[...]
  pattern-sinks:
  - pattern-either:
    - pattern: $DB->query(...)
    - pattern: $DB->prepare(...)
    - pattern: $DB->execute(...)
    - pattern: mysqli_query(...)
    - pattern: mysqli_prepare(...)
    - pattern: $REPOSITORY->find(...)
    - pattern: $REPOSITORY->findOneBy(...)
    - pattern: $MODEL::find(...)
    - pattern: $MODEL::findOrFail(...)
    - pattern: $QUERY->find(...)
    - pattern: $QUERY->findOrFail(...)
    - pattern: $QUERY->where(...)
    - pattern: $REPOSITORY->findById(...)
  message: 'Authorization Bypass Through User-Controlled Key (CWE-639 / IDOR): A request-controlled
    value reaches a database or ORM resource lookup. Verify that the current authenticated
    user is authorized to access the specific object, for example by scoping the query
    with both object ID and current user ID.'
  languages:
  - php
  severity: ERROR
  metadata:
    cwe:
    - CWE-639
- id: php-improper-access-control-cwe284
  patterns:
  - pattern-either:
    - patterns:
      - pattern-inside: "if ($_GET[...]) {\n  ...\n}\n"
      - pattern-either:
        - pattern: $DB->exec(...)
        - pattern: $DB->query(...)
        - pattern: $DB->execute(...)
        - pattern: mysqli_query(...)
        - pattern: unlink(...)
        - pattern: file_put_contents(...)
        - pattern: $SERVICE->deleteUser(...)
        - pattern: $SERVICE->changeUserRole(...)
        - pattern: $SERVICE->updateSettings(...)
    - patterns:
      - pattern-inside: "if ($_POST[...]) {\n  ...\n}\n"
      - pattern-either:
        - pattern: $DB->exec(...)
        - pattern: $DB->query(...)
        - pattern: $DB->execute(...)
        - pattern: mysqli_query(...)
        - pattern: unlink(...)
        - pattern: file_put_contents(...)
        - pattern: $SERVICE->deleteUser(...)
        - pattern: $SERVICE->changeUserRole(...)
        - pattern: $SERVICE->updateSettings(...)
    - patterns:
      - pattern-inside: "if ($_REQUEST[...]) {\n  ...\n}\n"
      - pattern-either:
        - pattern: $DB->exec(...)
        - pattern: $DB->query(...)
        - pattern: $DB->execute(...)
        - pattern: mysqli_query(...)
        - pattern: unlink(...)
        - pattern: file_put_contents(...)
        - pattern: $SERVICE->deleteUser(...)
        - pattern: $SERVICE->changeUserRole(...)
        - pattern: $SERVICE->updateSettings(...)
    - patterns:
      - pattern-inside: "if ($_COOKIE[...]) {\n  ...\n}\n"
      - pattern-either:
        - pattern: $DB->exec(...)
        - pattern: $DB->query(...)
        - pattern: $DB->execute(...)
        - pattern: mysqli_query(...)
        - pattern: unlink(...)
        - pattern: file_put_contents(...)
        - pattern: $SERVICE->deleteUser(...)
        - pattern: $SERVICE->changeUserRole(...)
        - pattern: $SERVICE->updateSettings(...)
    - patterns:
      - pattern-inside: "if ($_SERVER[...]) {\n  ...\n}\n"
      - pattern-either:
        - pattern: $DB->exec(...)
        - pattern: $DB->query(...)
        - pattern: $DB->execute(...)
        - pattern: mysqli_query(...)
        - pattern: unlink(...)
        - pattern: file_put_contents(...)
        - pattern: $SERVICE->deleteUser(...)
        - pattern: $SERVICE->changeUserRole(...)
        - pattern: $SERVICE->updateSettings(...)
    - pattern: $USER->setRole($_GET[...])
    - pattern: $USER->setRole($_POST[...])
    - pattern: $USER->setRole($_REQUEST[...])
    - pattern: $USER->role = $_GET[...]
    - pattern: $USER->role = $_POST[...]
    - pattern: $USER->role = $_REQUEST[...]
    - pattern: $USER->is_admin = $_GET[...]
    - pattern: $USER->is_admin = $_POST[...]
    - pattern: $USER->is_admin = $_REQUEST[...]
    - pattern: $MODEL::create($_POST)
    - pattern: $MODEL::create($_REQUEST)
    - pattern: $MODEL->fill($_POST)
    - pattern: $MODEL->fill($_REQUEST)
    - pattern: $MODEL->update($_POST)
    - pattern: $MODEL->update($_REQUEST)
    - pattern: $ACL->allow($SUBJECT, $RESOURCE, "all")
    - pattern: $ACL->allow($SUBJECT, $RESOURCE, "*")
    - pattern: $ACL->grant($SUBJECT, $RESOURCE, "all")
    - pattern: $ACL->grant($SUBJECT, $RESOURCE, "*")
    - pattern: chmod($PATH, 0777)
    - pattern: mkdir($PATH, 0777)
    - pattern: mkdir($PATH, 0777, true)
  message: 'Improper Access Control (CWE-284): The application uses client-controlled
    data to authorize a sensitive action, permits client-controlled privilege assignment,
    or configures an overly permissive ACL/file mode. Enforce authorization with a
    server-side session identity and a trusted RBAC/ABAC policy; never trust request
    parameters, cookies, or headers as proof of privilege.'
  languages:
  - php
  severity: ERROR
  metadata:
    cwe:
    - CWE-284
- id: php-command-injection-cwe77
  mode: taint
  pattern-sources:
  - pattern-either:
    - pattern: $_GET[...]
    - pattern: $_POST[...]
    - pattern: $_REQUEST[...]
    - pattern: $_COOKIE[...]
    - pattern: $_SERVER[...]
    - pattern: $_FILES[...]
    - pattern: filter_input(...)
    - pattern: filter_input_array(...)
    - pattern: $argv[...]
    - pattern: $REQUEST->input(...)
