                  - pattern: $SERVICE->changeUserRole(...)
                  - pattern: $SERVICE->updateSettings(...)
          - patterns:
              - pattern-inside: |
                  if ($_COOKIE[...]) {
                    ...
                  }
              - pattern-either:
                  - pattern: $DB->exec(...)
                  - pattern: $DB->query(...)
                  - pattern: $DB->execute(...)
                  - pattern: mysqli_query(...)
                  - pattern: unlink(...)
                  - pattern: file_put_contents(...)
                  - pattern: $SERVICE->deleteUser(...)
                  - pattern: $SERVICE->changeUserRole(...)
                  - pattern: $SERVICE->updateSettings(...)
          - patterns:
              - pattern-inside: |
                  if ($_SERVER[...]) {
